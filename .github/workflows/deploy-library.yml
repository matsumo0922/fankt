name: Deploy to central

on:
  release:
    types: [ released, prereleased ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Release build and publish
    runs-on: macOS-latest
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.MAVEN_SIGNING_KEY_ID }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_GPG_KEY_CONTENTS }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v1

      - uses: actions/cache@v3
        with:
          path: |
            ~/.konan
          key: ${{ runner.os }}-${{ hashFiles('**/.lock') }}

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v5
        with:
          gpg_private_key: ${{ secrets.MAVEN_GPG_KEY_CONTENTS }}
          passphrase: ${{ secrets.MAVEN_SIGNING_PASSWORD }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Verify FANBOX public boundary
        run: |
          consumer_repository="$RUNNER_TEMP/fankt-consumer-repository"
          ./gradlew \
            :fankt:fanbox:verifyKtorBoundary \
            :fankt:fanbox:publishKotlinMultiplatformPublicationToMavenLocal \
            :fankt:fanbox:publishAndroidReleasePublicationToMavenLocal \
            -Dmaven.repo.local="$consumer_repository" \
            --no-configuration-cache
          ./gradlew \
            -p compatibility-tests/ktor-independent-consumer \
            verifyKtorSelection \
            -PfanktRepository="$consumer_repository"

      - name: Publish Fanbox Room persistence library to MavenCentral
        run: ./gradlew :fankt:fanbox-persistence-room:publishAndReleaseToMavenCentral --no-configuration-cache

      - name: Publish Fanbox library to MavenCentral
        run: ./gradlew :fankt:fanbox:publishAndReleaseToMavenCentral --no-configuration-cache

      - name: Publish Fantia library to MavenCentral
        run: ./gradlew :fankt:fantia:publishAndReleaseToMavenCentral --no-configuration-cache
