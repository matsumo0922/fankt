name: Promote Guest Bundle

# deploy-guest-bundle.yml publishes every push to main to the dev channel. This places what was
# checked there into the channel consumers read, and runs only when someone starts it. Merging is
# therefore no longer enough to reach users, which is the point: the delivered bundle is executed on
# the next launch, and nothing else stops a bundle before it is delivered.
on:
  workflow_dispatch:

# Shared with deploy-guest-bundle.yml. Both push to gh-pages, where a concurrent push is rejected as
# non-fast-forward rather than merged, so they run one at a time.
concurrency:
  group: gh-pages-zipline
  cancel-in-progress: false

jobs:
  promote:
    name: Promote the dev bundle to the production channel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # The delivery branch, not the source: promotion copies what was published rather than
      # building again. A rebuild would put bytes nobody checked into the production channel.
      - name: Check out the delivery branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      # deploy-guest-bundle.yml applies the signature check to its own build output. That leaves the
      # production channel guarded only as long as a deploy run is the sole way content reaches the
      # dev path, so the check is repeated here against what is actually on the branch.
      - name: Refuse a manifest that is unsigned or bound to a channel
        run: |
          manifest="zipline/v1-dev/manifest.zipline.json"
          test -f "$manifest" || { echo "::error::$manifest is not on gh-pages; has Deploy Guest Bundle run?"; exit 1; }
          python3 - "$manifest" <<'PY'
          import json, sys
          with open(sys.argv[1]) as f:
              unsigned = json.load(f).get("unsigned", {})
          if not unsigned.get("signatures"):
              sys.exit("::error::the manifest carries no signature")
          # Everything under "unsigned" is removed before the signature is computed, so a baseUrl
          # naming the dev channel still verifies on device — and then the production manifest loads
          # the dev modules. Modules have to stay relative to the manifest for a copy to be a
          # promotion rather than a redirect.
          base_url = unsigned.get("baseUrl")
          if base_url is not None:
              sys.exit(f"::error::the manifest pins baseUrl to {base_url}; modules must resolve relative to it")
          print("manifest is signed and resolves its modules relative to its own URL")
          PY

      # keep_files stays off so that a module the new bundle no longer references does not survive
      # in the production channel. The deletion is scoped to destination_dir, leaving the dev channel
      # and the documents at the branch root untouched.
      - name: Publish to the production channel
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./zipline/v1-dev
          destination_dir: zipline/v1
