# 共通 detekt 設定テンプレート
# 前提バージョン: detekt 2.0.0-alpha.6 / detekt-rules-ktlint-wrapper / io.nlopez.compose.rules:detekt:0.6.8
# 実行方法とプロジェクト固有の調整はルートの README.md を参照

complexity:
  active: true
  # 論理演算子2つ以上（条件3つ以上）の条件式を検出する。Boolean 変数への切り出し方は AGENTS.md を参照
  ComplexCondition:
    active: true
    allowedConditions: 2
  LongMethod:
    active: true
    # 長い期待値や fixture を持つテストは production の上限で分割しない。
    excludes: ['**/src/*Test/**', '**/src/test/**']
    # Composable は UI 構造の記述で行数が伸びるため除外
    ignoreAnnotated:
      - 'Composable'
  LongParameterList:
    active: true
    ignoreDefaultParameters: true
    # Composable は引数が多くなる設計のため除外
    ignoreAnnotated:
      - 'Composable'
  TooManyFunctions:
    active: true
    excludes: ['**/src/*Test/**', '**/src/test/**']
    # 小さな private Composable へ分割するスタイルと衝突するため private は数えない
    ignorePrivate: true

  LargeClass:
    active: true
    excludes: ['**/src/*Test/**', '**/src/test/**']

coroutines:
  active: true

empty-blocks:
  active: true

exceptions:
  active: true
  TooGenericExceptionCaught:
    # 認証系ライブラリが Throwable などを投げるため無効化。導入プロジェクトで検出量を確認の上、有効化を検討する
    active: false

naming:
  active: true
  FunctionNaming:
    ignoreAnnotated:
      - 'Composable'
  MatchingDeclarationName:
    active: false
  PackageNaming:
    active: false
  TopLevelPropertyNaming:
    active: false
  # 一文字変数を検出する（`i` ではなく `index`）。命名の意味づけは AGENTS.md を参照
  VariableMinLength:
    active: true
    minimumVariableNameLength: 2

performance:
  active: true
  SpreadOperator:
    active: false

style:
  active: true
  MaxLineLength:
    active: false
  MagicNumber:
    active: false
  ReturnCount:
    # 早期 return を多用するスタイルのため無効化
    active: false
  ThrowsCount:
    active: false
  LoopWithTooManyJumpStatements:
    active: false
  ForbiddenComment:
    # 開発時のコメントを削除する必要はないため無効化
    active: false
  DestructuringDeclarationWithTooManyEntries:
    # Compose の ConstraintLayout#createRefs などで用いるため無効化
    active: false
  # 空のコレクションは emptyList() などの empty 系で生成する
  UseEmptyCounterpart:
    active: true
  # プロパティ、メソッド、companion object の順序を強制する
  ClassOrdering:
    active: true
  # 複数行の for / while に中括弧を強制する
  MandatoryBracesLoops:
    active: true
  # メソッドチェーンは1行に2呼び出しまで。3呼び出し以上は改行する
  MaxChainedCallsOnSameLine:
    active: true
    maxChainedCalls: 2
  # UnusedPrivateFunction / UnusedPrivateProperty は型情報が必要なため、full モードのタスクでだけ実行される（README.md の「静的解析」を参照）
  UnusedPrivateFunction:
    active: true
    # Compose の Preview 関数は呼び出されないため除外
    ignoreAnnotated:
      - 'Preview'
  UnusedPrivateProperty:
    active: true
    # Test でモックしているプロパティは除外
    ignoreAnnotated:
      - 'RelaxedMockK'
      - 'InjectMockKs'

comments:
  # UndocumentedPublicClass は Activity / Fragment / Dialog / ViewModel をクラス名で除外できないため使わない。
  # KDoc の規約（対象クラスと日本語での記述）は AGENTS.md で扱う
  active: false

potential-bugs:
  active: true
  UnsafeCallOnNullableType:
    # `!!` を許容している。導入プロジェクトで検出量を確認の上、有効化を検討する
    active: false

ktlint:
  active: true
  autoCorrect: true
  MaximumLineLength:
    active: false
  # 引数の折り返しは行長では判断しない。AGENTS.md の引数数・デフォルト値の規約をレビューする
  ArgumentListWrapping:
    active: false
  ParameterListWrapping:
    active: false
  # デフォルト引数を持つ短い関数を1行に戻すため、規約と両立しない。
  # 関数定義の引数数とデフォルト値による改行は AGENTS.md に従って確認する。
  FunctionSignature:
    active: false
  # デフォルト引数を含むコンストラクタの複数行表記を維持する。
  ClassSignature:
    active: false
  NoWildcardImports:
    # style ルールセットの WildcardImport で検出するため、二重報告を避けて無効化
    active: false
  # 定義箇所での trailing comma を強制する
  TrailingCommaOnDeclarationSite:
    active: true
  # 呼び出し箇所での trailing comma を強制する
  TrailingCommaOnCallSite:
    active: true
  PackageName:
    active: false
  Filename:
    active: false

Compose:
  active: true
  # Composable に modifier 引数を必須にする
  ModifierMissing:
    active: true
  # modifier 引数のデフォルト値 `Modifier` を強制する
  ModifierWithoutDefault:
    active: true
  # 必須引数 → デフォルト引数（modifier が先頭）→ 末尾ラムダ の宣言順を強制する
  ComposableParamOrder:
    active: true
  # ラムダ引数名を現在形（onClick / onChange）に強制する
  ParameterNaming:
    active: true
  # Composable 引数の List / Map / Set を検出し、Immutable なコレクション型を強制する（opt-in のため明示有効化）
  UnstableCollections:
    active: true
  CompositionLocalAllowlist:
    # CompositionLocal の利用を許可リスト制にはしない
    active: false
